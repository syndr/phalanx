# Xwayland compiled-keymap output directory.
#
# swaylock-plugin's seatless wallpaper path spawns a nested Xwayland per output,
# each of which compiles its core keyboard via xkbcomp and writes
# /var/lib/xkb/server-N.xkm. Bazzite ships Xwayland without
# xorg-x11-server-common, so the directory is otherwise absent and the keymap
# compile fails ("Failed to activate virtual core keyboard").
#
# /var is machine-local state populated at boot and is NOT part of the ostree
# image, so this must be created via tmpfiles rather than mkdir in build.sh.
# Mode 1777 (sticky, world-writable like /tmp) is required because Xwayland runs
# rootless and a 0755 root-owned directory would be unwritable.
d /var/lib/xkb 1777 root root -
